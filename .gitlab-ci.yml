variables:
  CTX_WORKFLOW_CHECKS: "0"

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"'
      when: never
    - if: '$CI_COMMIT_BRANCH'

default:
  image: python:3.12-bookworm
  before_script:
    - python -m pip install --disable-pip-version-check -r requirements-workflow.txt
  interruptible: true

stages: [workflow, verify, acceptance, source-security, package, artifact-security, configure, readiness]

ctx:workflow-validate:
  stage: workflow
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CTX_WORKFLOW_CHECKS == "1"'
  script:
    - python scripts/ctx_workflow.py validate

ctx:workflow-tests:
  stage: workflow
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CTX_WORKFLOW_CHECKS == "1"'
  script:
    - python -m unittest discover -s tests/workflow -v

ctx:design-validate:
  stage: workflow
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CTX_WORKFLOW_CHECKS == "1"'
  script:
    - python scripts/ctx_design.py --all

# Application and delivery checks are explicitly opt-in while Habitat has no code.
# This include is a fail-closed adapter contract, NOT completed stage coverage.
include:
  - local: .gitlab/ci/controller.yml
  - local: .gitlab/ci/delivery.yml
    rules:
      - if: '$CTX_APPLICATION_CHECKS == "1"'
