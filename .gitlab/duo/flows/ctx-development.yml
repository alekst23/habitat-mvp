        - skills/ctx-project-sleep/SKILL.md
        - skills/ctx-epic-docs/SKILL.md

        Integrate only the reviewed ticket under repository policy. Verify ancestry and
        run sufficient checks on the new epic SHA before persisting done with evidence.
        If tickets remain, checkpoint and return more; name the next same-flow invocation.
        If all are integrated, update required docs BEFORE final epic review, commit, and
        obtain full-epic acceptance and required CI at that final SHA. Return complete only
