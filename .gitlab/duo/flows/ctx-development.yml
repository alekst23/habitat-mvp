        - skills/ctx-ci-check/SKILL.md

        Implement the scoped change, commit and push the ticket MR to the epic. Run the
        reviewed application adapter and required CI. Retain the acceptance evidence.
        Save the current candidate SHA in the session and issue. Return ready when code and
        verification are ready for browser checks. If CI is pending, persist a same-flow
        resume instruction and return blocked. Do not pass on workflow self-tests alone.
      user: |
        Project ID: {{ project_id }}
        Request and source context: {{ goal }}
      placeholder: history
    params:
      timeout: 180
