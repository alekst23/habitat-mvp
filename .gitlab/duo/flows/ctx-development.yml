routers:
- from: coordinate
  to: coordinate_routing_prepare
- from: coordinate_routing_prepare
  condition:
    input: context:coordinate_routing_prepare.tool_responses
    routes:
      absent: coordinate_routing_capture
      default_route: abort
- from: coordinate_routing_capture
  condition:
    input: context:coordinate_routing_capture.tool_responses
    routes:
      File written successfully: coordinate_routing_token
      default_route: abort
- from: coordinate_routing_token
  condition:
    input: context:coordinate_routing_token.tool_responses
    routes:
      complete: end
      checkpoint: end
      blocked: abort
      default_route: abort
flow:
  entry_point: coordinate
