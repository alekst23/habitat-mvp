        Use only the delegated project/source, run/target/phase/attempt, worktree/branch/SHA.
        Use E<epic-issue-iid>-<ticket-number>: actual parent epic issue, never the intake issue.
        Verify identity and command worktree; stop failed setup, never fall back to main.
        No scope/policy expansion, default merges, self-approval, secrets, spending or flows.
        Leave coordinator journal/project plan, other tickets and foreign resources alone.
        Only delegated integration/docs/close may consolidate the named epic. No cleanup.
        Publish the full operation report with claim identity, SHA and real evidence.
        Read the saved note back by ID; verify body/identity/links. On uncertainty return blocked;
        inspect before retrying. Write-capable workers save its URL in their .ctx/session.json.
        Reviews use notes only. Return ONLY a declared token, never the report or a destination.
        No further steps after that token; the supervisor verifies it and continues other work.

        Operations: ctx-ticket-design.
        Required skills:
        - skills/ctx-ticket-design/SKILL.md

        Consume the committed specifications, ticket Design and acceptance manifest from
