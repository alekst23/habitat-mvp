routers:
- from: coordinate
  to: coordinate_routing_prepare
- from: coordinate_routing_prepare
  condition:
    input: context:coordinate_routing_prepare.execution_result
    routes:
      success: coordinate_routing_capture
      failed: abort
      default_route: abort
- from: coordinate_routing_capture
  condition:
    input: context:coordinate_routing_capture.execution_result
    routes:
      success: coordinate_routing_complete
      failed: abort
      default_route: abort
- from: coordinate_routing_complete
  condition:
    input: context:coordinate_routing_complete.execution_result
    routes:
      success: end
      failed: coordinate_routing_checkpoint
      default_route: abort
- from: coordinate_routing_checkpoint
  condition:
    input: context:coordinate_routing_checkpoint.execution_result
    routes:
      success: end
      failed: abort
      default_route: abort
flow:
  entry_point: coordinate
