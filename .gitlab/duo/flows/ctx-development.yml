        - skills/ctx-ticket-tests/SKILL.md

        Use the absolute minimum meaningful tests. Reuse tests and map multiple ACs to
        one test where appropriate. Establish the valid behavioral red baseline or record
        why existing coverage/inspection suffices. Preserve the approved requirements.
        Publish test plan, IDs, evidence and SHA. Return ready only with the prerequisites
