        after that final answer; put explanations and evidence in the operation report.

        Operations: ctx-ticket-design.
        Required skills:
        - skills/ctx-ticket-design/SKILL.md

        Work only on the selected ticket branch. Save the design and update the session
        candidate SHA plus source issue report. Return ready when the design is usable.
      user: |
        Project ID: {{ project_id }}
        Request and source context: {{ goal }}
      placeholder: history
    params:
      timeout: 180
