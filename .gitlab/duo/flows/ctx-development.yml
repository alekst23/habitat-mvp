        Operations: ctx-browser-check.
        Required skills:
        - skills/ctx-browser-check/SKILL.md

        Run required UI journeys through configured Playwright tooling or read matching
        completed browser-job evidence. This component has execution tools; the reviewer
        does not. Do not modify application code or acceptance criteria while validating.
        No UI ACs: record not-applicable and its reason. UI ACs with no runtime: blocked.
        The final acceptance evidence must include all required methods for the scope.
        Require the ctx:acceptance job (or local acceptance adapter plus actual required CI)
        to validate manifest coverage at the current SHA before returning ready. The
        acceptance adapter merges .ctx/acceptance.json from verify with the independent
        .ctx/browser/acceptance.json report; both must match this pipeline and scope.
