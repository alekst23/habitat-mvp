routers:
  - from: coordinate
    condition:
      input: context:coordinate.final_answer
      routes:
        design: design
        tests: tests
        implementation: implementation
        browser: browser
        integrate: integrate
        epic: epic_review
        checkpoint: end
        blocked: abort
        default_route: abort
  - from: design
    condition:
      input: context:design.final_answer
      routes:
        ready: tests
        blocked: abort
        default_route: abort
  - from: tests
    condition:
      input: context:tests.final_answer
      routes:
        ready: implementation
        blocked: abort
        default_route: abort
  - from: implementation
    condition:
      input: context:implementation.final_answer
      routes:
        ready: browser
        blocked: abort
        default_route: abort
  - from: browser
    condition:
      input: context:browser.final_answer
      routes:
        ready: review
        blocked: abort
        default_route: abort
  - from: review
    condition:
      input: context:review.final_answer
      routes:
        ready: integrate
        blocked: abort
        default_route: abort
  - from: integrate
    condition:
      input: context:integrate.final_answer
      routes:
        more: end
        complete: epic_review
        blocked: abort
        default_route: abort
  - from: epic_review
    condition:
      input: context:epic_review.final_answer
      routes:
        ready: close
        blocked: abort
        default_route: abort
  - from: close
    condition:
      input: context:close.final_answer
      routes:
        ready: end
        blocked: abort
        default_route: abort
flow:
  entry_point: coordinate
