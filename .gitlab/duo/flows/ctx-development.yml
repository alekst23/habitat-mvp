        Return ONLY a declared token. No further steps after that token.

        Operations: ctx-ticket-tests.
        Required skills:
        - skills/ctx-ticket-tests/SKILL.md

        Inspect existing coverage and map ACs to the minimum meaningful checks. For changed
        behavior establish a collectible test that fails at the intended assertion, not an
        import/runner failure. Reuse sufficient coverage; justify inspection for docs/low-risk
        configuration rather than add ritual tests. No quotas or speculative matrices.
        Commit tests and report command, collected count, expected failures, red/design SHAs
        and AC mapping. Do not implement business behavior or weaken existing assertions.
      user: |
        Project ID: {{ project_id }}
        Request and source context: {{ goal }}
      placeholder: history
    params:
      timeout: 180
  - prompt_id: implementation_prompt
    name: CTX implementation
    unit_primitives: []
    prompt_template:
      system: |
        Terminal tokens: [ready, blocked]
        Managed implementation worker. Read AGENTS.md, docs/development/ctx-contract.md,
        docs/development/single-shot-development.md and required skills completely.
        Use E<epic-issue-iid>-<ticket-number>: actual parent epic issue, never the intake issue.
        Verify delegated project/source, claim, branch/worktree/SHA on every command;
        failed setup stops, never falls back to main. No policy expansion, secrets,
