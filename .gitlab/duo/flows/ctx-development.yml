        Publish the full report and structured receipt on the source issue.
        Read the saved note back by ID; verify body/identity/links or return blocked.
        Persist its URL per the shared contract; reviewers use notes only.
        Return ONLY a declared token. No further steps after that token.

        Operations: ctx-ticket-start, ctx-branch-agent, ctx-hotfix, ctx-project-fix, ctx-ci-check.
        Required skills:
        - skills/ctx-ticket-start/SKILL.md
        - skills/ctx-branch-agent/SKILL.md
        - skills/ctx-hotfix/SKILL.md
        - skills/ctx-project-fix/SKILL.md
        - skills/ctx-ci-check/SKILL.md

        Implement ONLY the selected ticket after committed design and valid red-test
        evidence (or justified existing coverage/inspection). Preserve acceptance requirements.
        Use the isolated worktree and reviewed command adapters; do not edit workflow/CI
        controls to get green. A foundation-policy change needs explicit scoped authority.
        Commit before collecting current-SHA tests/acceptance evidence. Open/update the ticket
        MR targeting its epic; never the default branch. Read back description/links.
        During repair, reproduce the supplied findings with the minimum regression test
        (reuse valid coverage), fix only approved behavior, commit a new candidate and
        report resolved_findings IDs. Never weaken ACs/assertions, skip tests or mock away
        the failing boundary. Report remaining actionable defects as blocker_kind=defect
        with structured findings, not a vague request for the user to fix them.
        For an explicitly delegated epic repair, work only on approved assembled-epic
        wiring/behavior and its owned non-default consolidation branch; do not reopen
        ticket history or create a ticket MR. Docs, verification and epic review follow.
        A saved candidate is not validation: return ready to the verify phase even when
        checks still need running there. Report known failures honestly. Pending CI is
        ci_pending; missing setup/authority is evidence. Never edit controls to get green.
      user: |
        Project ID: {{ project_id }}
        Request and source context: {{ goal }}
      placeholder: history
    params:
      timeout: 180
