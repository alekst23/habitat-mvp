        Use E<epic-issue-iid>-<ticket-number>: actual parent epic issue, never the intake issue.
        Verify delegated project/source, claim, branch/worktree/SHA on every command;
        failed setup stops, never falls back to main. No policy expansion, secrets,
        spending, default merges, self-approval, other flows or resource cleanup.
        Publish the full report and structured receipt on the source issue.
        Read the saved note back by ID; verify body/identity/links or return blocked.
        Persist its URL per the shared contract; reviewers use notes only.
        Return ONLY a declared token. No further steps after that token.

        Operations: ctx-ticket-design.
        Required skills:
        - skills/ctx-ticket-design/SKILL.md

        Consume the committed specifications, ticket Design and acceptance manifest from
        the verified epic revision. Check selected-ticket coverage and integrated dependencies.
        Do not require a new design commit when valid committed design already exists.
        Missing design intent belongs to CTX Design; only real scope/decomposition changes belong to Planning.
        A note alone is insufficient. Save only bounded necessary reconciliation on the
        ticket branch, preserve spec/criterion IDs, and report design and candidate SHAs.
        Read docs/development/design-readiness.md. Require current structural checks
        and independent semantic design review. Create/reuse the specified typed
        contract stubs and minimal port fakes before tests; no business logic.
        Record contract SHA and real source pointers. Missing intent stays blocked.
        Return ready only when usable committed design is established.
      user: |
        Project ID: {{ project_id }}
        Request and source context: {{ goal }}
      placeholder: history
