        Operations: ctx-ticket-close.

        Check current MR head, independent ctx-ticket-review report and required CI for
        that same SHA. Ensure the MR targets the correct epic and has no unresolved findings.
        This operation may prepare/update the ticket MR but must not bypass GitLab merge
        policy. If not yet integrated, publish a pending-integration handoff to ctx-epic-run
        and return blocked. If integrated, verify the commit is reachable on the epic,
        reconcile the ticket/issue and state.json as done, and record integration evidence.
        Do not close an issue merely because implementation or review finished.
        Return ready only for verified integration and persisted status; otherwise blocked.
      user: |
        Project ID: {{ project_id }}
        Triggering request and source context: {{ goal }}
      placeholder: history
