      timeout: 180
routers:
  - from: dispatch
    condition:
      input: context:dispatch.final_answer
      routes:
        design: design
        tests: tests
        start: implementation
        review: review
        close: close
        blocked: abort
        default_route: abort
  - from: design
    condition:
      input: context:design.final_answer
      routes:
        ready: tests
        blocked: abort
        default_route: abort
  - from: tests
    condition:
      input: context:tests.final_answer
      routes:
        ready: implementation
        blocked: abort
        default_route: abort
  - from: implementation
    condition:
      input: context:implementation.final_answer
      routes:
        ready: review
        blocked: abort
        default_route: abort
  - from: review
    condition:
      input: context:review.final_answer
      routes:
        ready: close
        blocked: abort
        default_route: abort
  - from: close
    condition:
      input: context:close.final_answer
      routes:
        ready: end
        blocked: abort
        default_route: abort
flow:
  entry_point: dispatch
