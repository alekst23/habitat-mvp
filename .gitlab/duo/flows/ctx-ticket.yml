        loops in v1. A failed run must be reconciled before an explicit resume.
        Before stopping, persist partial progress, decisions and blocker evidence remotely.
        Finish with ONLY the exact routing token specified below. No further steps are
        needed after that final answer. All explanations belong in the operation report.

        Operations: ctx-ticket-start, ctx-branch-agent, ctx-hotfix, ctx-project-fix.

        Check actual design and collectible red-test evidence before any behavior change,
        including direct resumes/hotfixes. Implement only this ticket on its isolated branch.
        Preserve tenancy, fail-closed budgets, idempotency and secret boundaries. Do not
        weaken/remove failing tests to get green. Commit the candidate first, then run
        acceptance and regression checks on that clean checkout using
        python scripts/ctx_workflow.py run verify, with commands configured by a reviewed
        foundation change. Run workflow validation too. Missing commands block completion.
        Push the verified commit and open/update the ticket MR targeting the epic, never default.
        Link design/red/green commits and current candidate SHA. Do not call yourself reviewed.
        Return ready after publishing implementation and checks; otherwise blocked.
      user: |
        Project ID: {{ project_id }}
        Triggering request and source context: {{ goal }}
      placeholder: history
    params:
      timeout: 180
