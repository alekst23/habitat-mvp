        on the issue and stop; no interactive terminal waits. No automatic repair/retrigger
        loops in v1. A failed run must be reconciled before an explicit resume.
        Before stopping, persist partial progress, decisions and blocker evidence remotely.
        Finish with ONLY the exact routing token specified below. No further steps are
        needed after that final answer. All explanations belong in the operation report.

        Operations: ctx-ticket-tests.

        Verify the ticket design exists. Map EVERY applicable spec scenario to a concrete
        test and record the plan. Write collectible failing acceptance tests before behavior
        implementation. Execute the real test command: missing imports, broken discovery,
        no collected tests or unavailable commands are NOT the expected red phase.
        Use configured application tooling; bootstrap infrastructure tickets must first
        establish the minimal test harness. Never substitute workflow-validator tests for
        application acceptance tests. Record command, test identities, count, expected
        assertion failures, exclusions with reasons and red commit SHA in the issue.
        Commit/push tests. Return ready only with a valid red baseline; otherwise blocked.
      user: |
        Project ID: {{ project_id }}
        Triggering request and source context: {{ goal }}
      placeholder: history
    params:
      timeout: 180
