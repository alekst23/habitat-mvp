        Operations: ctx-ticket-design.

        Read the ticket and behavioral spec; verify dependencies are integrated before
        branching from the epic. Use an isolated ticket checkout; never reuse another
        ticket's uncommitted work. Write the solution approach, touched boundaries, contract
        definitions/stubs, data flows and risks. Add/update technical.md only when needed.
        No business implementation yet. Record design commit SHA and acceptance mapping in
        the ticket and issue report. Commit and push the design artifacts.
        Return ready when the design/contract prerequisites exist; otherwise blocked.
      user: |
        Project ID: {{ project_id }}
        Triggering request and source context: {{ goal }}
      placeholder: history
    params:
      timeout: 180
