# Scope and browser applicability come from committed candidate identity.
# A non-UI scope records not-applicable; a UI scope fails without real browser evidence.
ctx:browser:
  stage: verify
  image: mcr.microsoft.com/playwright:v1.63.0-noble
  before_script: []
  allow_failure: false
  timeout: 10 minutes
  variables:
    GIT_DEPTH: "0"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      exists: ["docs/plan/E*/state.json"]
    - if: '$CI_COMMIT_BRANCH'
      exists: ["docs/plan/E*/state.json"]
  script:
    - apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends python3 python3-venv python3-pip
    - python3 -m venv .ctx/venv
    - export PATH="$PWD/.ctx/venv/bin:$PATH"
    - python scripts/ctx_ci_context.py browser
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - .ctx/browser/
    reports:
      junit: .ctx/browser/junit.xml
