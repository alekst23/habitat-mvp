include:
  - local: .gitlab/ci/browser.yml

.ctx-check:
  allow_failure: false
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
  timeout: 20 minutes
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - .ctx/reports/
      - .ctx/acceptance.json

# Backend dependencies come from E11-1's pinned backend/requirements.txt. Install them
# when present (a failed install fails the job); without them the adapter still
# fails closed because no backend/tests exist. No database service: E11 uses SQLite.
ctx:verify:
  extends: .ctx-check
  stage: verify
  before_script:
    - python -m pip install --disable-pip-version-check -r requirements-workflow.txt
    - if [ -f backend/requirements.txt ]; then python -m pip install --disable-pip-version-check -r backend/requirements.txt; fi
  script:
    - python scripts/ctx_workflow.py run verify

ctx:acceptance:
  extends: .ctx-check
  stage: acceptance
  needs:
    - job: ctx:verify
    - job: ctx:browser
      optional: true
  script:
    - python scripts/ctx_workflow.py run acceptance

ctx:source-security:
  extends: .ctx-check
  stage: source-security
  needs: ["ctx:verify", "ctx:acceptance"]
  script:
    - python scripts/ctx_workflow.py run source-security

ctx:package:
  extends: .ctx-check
  stage: package
  needs: ["ctx:verify", "ctx:acceptance", "ctx:source-security"]
  script:
    - python scripts/ctx_workflow.py run package

ctx:artifact-security:
  extends: .ctx-check
  stage: artifact-security
  needs: ["ctx:verify", "ctx:acceptance", "ctx:source-security", "ctx:package"]
  script:
    - python scripts/ctx_workflow.py run artifact-security

ctx:configure:
  extends: .ctx-check
  stage: configure
  needs: ["ctx:verify", "ctx:acceptance", "ctx:source-security", "ctx:package", "ctx:artifact-security"]
  script:
    - python scripts/ctx_workflow.py run configure

# A read-only consistency gate, not deployment authorization. Plan/create/govern
# receipts must be produced by reviewed jobs after GitLab readback, not invented
# by the model. Missing receipts block the candidate; validation is not deployment.
ctx:delivery-readiness:
  extends: .ctx-check
  stage: readiness
  when: always
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  needs: ["ctx:verify", "ctx:acceptance", "ctx:source-security", "ctx:package", "ctx:artifact-security", "ctx:configure"]
  script:
    - python scripts/ctx_delivery.py --phase candidate

# Readiness is release-branch-only: a feature MR cannot yet have a merged release
# SHA. Do not make merged-candidate receipts a circular prerequisite of that MR.
# Deliberately no deploy/promote job. Add deployment credentials and protected
# environment controls only with real adapters and reviewed target/approval rules.
