include:
  - local: .gitlab/ci/browser.yml

.ctx-check:
  allow_failure: false
  variables:
    GIT_DEPTH: "0"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      exists: ["docs/plan/E*/state.json"]
    - if: '$CI_COMMIT_BRANCH'
      exists: ["docs/plan/E*/state.json"]
  timeout: 20 minutes
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - .ctx/reports/
      - .ctx/acceptance.json

ctx:verify:
  extends: .ctx-check
  stage: verify
  before_script:
    - python -m pip install --disable-pip-version-check -r requirements-workflow.txt
    - if [ -d backend ]; then python -m pip install --disable-pip-version-check --require-hashes -r backend/requirements.lock; fi
  script:
    - python scripts/ctx_workflow.py run verify

ctx:acceptance:
  extends: .ctx-check
  stage: acceptance
  needs:
    - job: ctx:verify
    - job: ctx:browser
      optional: true
  script:
    - python scripts/ctx_workflow.py run acceptance

ctx:source-security:
  extends: .ctx-check
  stage: source-security
  needs: ["ctx:verify", "ctx:acceptance"]
  before_script:
    - python -m pip install --disable-pip-version-check -r requirements-workflow.txt -r requirements-security.txt
    - python scripts/ctx_security_tools.py trivy
    - export PATH="$PWD/.ctx/bin:$PATH"
  script:
    - python scripts/ctx_workflow.py run source-security
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - .ctx/reports/
      - .ctx/acceptance.json
      - .ctx/security/
    reports:
      sast: .ctx/security/gl-sast-report.json
      dependency_scanning: .ctx/security/gl-dependency-scanning-report.json
      secret_detection: .ctx/security/gl-secret-detection-report.json

# Keep ticket-scoped integration evidence available on an open draft epic MR,
# but do not permit that MR into default until full-epic scope is selected/passed.
ctx:epic-scope:
  extends: .ctx-check
  stage: acceptance
  needs: ["ctx:verify"]
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == $CI_DEFAULT_BRANCH'
      exists: ["docs/plan/E*/state.json"]
  script:
    - python scripts/ctx_ci_context.py require-whole-epic

# Docker jobs build/read the candidate archive only; no registry or cloud authority.
.ctx-docker:
  image: docker:28.5.1-cli
  services:
    - name: docker:28.5.1-dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: /certs
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: /certs/client
  before_script:
    - apk add --no-cache python3 py3-pip git
    - python3 -m venv .ctx/venv
    - export PATH="$CI_PROJECT_DIR/.ctx/venv/bin:$CI_PROJECT_DIR/.ctx/bin:$PATH"
    - python -m pip install --disable-pip-version-check -r requirements-workflow.txt
    - python scripts/ctx_security_tools.py trivy

ctx:package:
  extends: [.ctx-check, .ctx-docker]
  artifacts:
    when: always
    expire_in: 30 days
    paths: [.ctx/reports/, .ctx/package/, .ctx/security/]
    reports:
      cyclonedx: .ctx/security/gl-sbom-container.cdx.json
  stage: package
  needs: ["ctx:verify", "ctx:acceptance", "ctx:source-security"]
  script:
    - python scripts/ctx_workflow.py run package

ctx:artifact-security:
  extends: .ctx-check
  before_script:
    - python -m pip install --disable-pip-version-check -r requirements-workflow.txt
    - python scripts/ctx_security_tools.py trivy
    - export PATH="$PWD/.ctx/bin:$PATH"
  artifacts:
    when: always
    expire_in: 30 days
    paths: [.ctx/reports/, .ctx/security/]
    reports:
      container_scanning: .ctx/security/gl-container-scanning-report.json
  stage: artifact-security
  needs: ["ctx:verify", "ctx:acceptance", "ctx:source-security", "ctx:package"]
  script:
    - python scripts/ctx_workflow.py run artifact-security

ctx:configure:
  extends: [.ctx-check, .ctx-docker]
  artifacts:
    when: always
    expire_in: 30 days
    paths: [.ctx/reports/, .ctx/deploy/]
  stage: configure
  needs: ["ctx:verify", "ctx:acceptance", "ctx:source-security", "ctx:package", "ctx:artifact-security"]
  script:
    - python scripts/ctx_workflow.py run configure

# A read-only consistency gate, not deployment authorization. Plan/create/govern
# receipts must be produced by reviewed jobs after GitLab readback, not invented
# by the model. Missing receipts block the candidate; validation is not deployment.
ctx:delivery-readiness:
  extends: .ctx-check
  stage: readiness
  when: always
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      exists: ["docs/plan/E*/state.json"]
  needs: ["ctx:verify", "ctx:acceptance", "ctx:source-security", "ctx:package", "ctx:artifact-security", "ctx:configure"]
  script:
    - python scripts/ctx_ci_context.py delivery-readiness

# Readiness is release-branch-only: a feature MR cannot yet have a merged release
# SHA. Do not make merged-candidate receipts a circular prerequisite of that MR.
# Deliberately no deploy/promote job. Add deployment credentials and protected
# environment controls only with real adapters and reviewed target/approval rules.
